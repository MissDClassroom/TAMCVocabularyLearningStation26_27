<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spot Vocab Lab</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;800&family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* "Pop Lab" theme, reusable for every vocab deck: lavender ground, ink outlines with offset "sticker" shadows, one bright colour per deck.
   Layout: header + deck picker + mode tiles on the home view; each mode opens full-width in the same column. */
:root{
  --bg:#f5f2ff; --surface:#ffffff; --sunk:#ebe6fb; --ink:#1b1440; --muted:#5f5885; --line:#d6cff2;
  --primary:#6b3cf5; --on:#ffffff; --star:#ffbf1f; --star-ink:#2a1d00;
  --ok:#14945a; --ok-t:#d3f5e3; --no:#e2364a; --no-t:#ffdde1;
  --d1:#1a7fd9; --d2:#f0533f; --d3:#7a3ff0; --d4:#0f9a74; --d5:#d23f8a; --d6:#c27a00; --d7:#0a8f8f; --d8:#4558e6;
  --shadow:4px 4px 0 var(--ink);
  --bw:2.5px; --bw2:2px; --bd:var(--ink); --r:18px;
  --sh-btn:3px 3px 0 var(--ink); --sh-btn-h:4px 4px 0 var(--ink); --sh-btn-a:1px 1px 0 var(--ink); --sh-h:6px 6px 0 var(--ink);
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Atkinson Hyperlegible","Segoe UI",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#130f27; --surface:#1d1739; --sunk:#181332; --ink:#efeaff; --muted:#a79fd0; --line:#352c5e;
  --primary:#a184ff; --on:#140f2a; --star:#ffcf4d; --star-ink:#2a1d00;
  --ok:#5ee0a0; --ok-t:#16402c; --no:#ff7a8a; --no-t:#4f1a24;
  --d1:#5fb4ff; --d2:#ff8a78; --d3:#b59bff; --d4:#4fd6ae; --d5:#ff8fc8; --d6:#ffc65c; --d7:#5fe0e0; --d8:#8c9bff;
  --shadow:4px 4px 0 #000; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#130f27; --surface:#1d1739; --sunk:#181332; --ink:#efeaff; --muted:#a79fd0; --line:#352c5e;
  --primary:#a184ff; --on:#140f2a; --star:#ffcf4d; --star-ink:#2a1d00;
  --ok:#5ee0a0; --ok-t:#16402c; --no:#ff7a8a; --no-t:#4f1a24;
  --d1:#5fb4ff; --d2:#ff8a78; --d3:#b59bff; --d4:#4fd6ae; --d5:#ff8fc8; --d6:#ffc65c; --d7:#5fe0e0; --d8:#8c9bff;
  --shadow:4px 4px 0 #000; color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:17px;line-height:1.5;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:18px;padding-block:20px 70px;display:flex;flex-direction:column;gap:22px}
h1,h2,h3{font-family:var(--display);margin:0;letter-spacing:-.015em;text-wrap:balance}
h1{font-size:2.2em;font-weight:800;line-height:1}
h2{font-size:1.5em;font-weight:800;line-height:1.1}
h3{font-size:1.1em;font-weight:700}
p{margin:0}
.eyebrow{font-family:var(--mono);font-size:.72em;letter-spacing:.09em;text-transform:uppercase;color:var(--muted)}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--primary);outline-offset:3px}

.pop{background:var(--surface);border:var(--bw) solid var(--bd);border-radius:var(--r);box-shadow:var(--shadow)}
.btn{border:var(--bw) solid var(--bd);background:var(--surface);border-radius:12px;padding:.45em 1em;font-weight:700;box-shadow:var(--sh-btn);transition:transform .08s,box-shadow .08s}
.btn:hover{transform:translate(-1px,-1px);box-shadow:var(--sh-btn-h)}
.btn:active{transform:translate(2px,2px);box-shadow:var(--sh-btn-a)}
.btn.main{background:var(--primary);color:var(--on)}
.btn.good{background:var(--ok);color:var(--on)}
.btn.bad{background:var(--no);color:var(--on)}
.btn:disabled{opacity:.5;cursor:default;transform:none}
.ghost{border:0;background:none;color:var(--muted);font-weight:700;padding:.3em .5em;border-radius:8px}
.ghost:hover{color:var(--ink);background:var(--sunk)}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{flex:1}

/* header */
.top{display:flex;flex-wrap:wrap;gap:14px;align-items:end;justify-content:space-between}
.top .t{display:flex;flex-direction:column;gap:6px}
.logo{display:inline-flex;gap:4px;align-items:center}
.logo i{width:14px;height:14px;border-radius:4px;border:var(--bw2) solid var(--bd);display:inline-block}
.stats{display:flex;gap:10px}
.stat{padding:.35em .8em;border-radius:12px;border:var(--bw) solid var(--bd);background:var(--surface);font-family:var(--display);font-weight:800;font-size:1.05em;font-variant-numeric:tabular-nums;display:flex;gap:6px;align-items:baseline}
.stat small{font-family:var(--mono);font-weight:400;font-size:.6em;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.stat.fire{background:var(--star);color:var(--star-ink)} .stat.fire small{color:var(--star-ink)}

/* deck picker */
.decks{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,200px),1fr));gap:14px}
.deck{text-align:left;padding:14px 16px;display:flex;flex-direction:column;gap:8px;border:var(--bw) solid var(--bd);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);position:relative;min-width:0}
.deck .num{font-family:var(--display);font-weight:800;font-size:.85em;color:var(--on);background:var(--c);border:var(--bw2) solid var(--bd);border-radius:8px;padding:0 .45em;align-self:flex-start}
.deck h3{font-size:1.08em;line-height:1.15}
.deck .bar{height:10px;border-radius:6px;background:var(--sunk);border:var(--bw2) solid var(--bd);overflow:hidden}
.deck .bar i{display:block;height:100%;background:var(--c)}
.deck .meta{font-family:var(--mono);font-size:.72em;color:var(--muted)}
.deck .tick{position:absolute;top:10px;right:10px;width:26px;height:26px;border-radius:50%;border:var(--bw) solid var(--bd);display:grid;place-items:center;font-weight:800;background:var(--surface)}
.deck[aria-pressed="true"]{background:color-mix(in srgb,var(--c) 16%,var(--surface))}
.deck[aria-pressed="true"] .tick{background:var(--c);color:var(--on)}
.filter{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.toggle{border:var(--bw) solid var(--bd);border-radius:999px;padding:.25em .8em;background:var(--surface);font-weight:700;font-size:.88em}
.toggle[aria-pressed="true"]{background:var(--star);color:var(--star-ink)}

/* mode tiles */
.modes{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,170px),1fr));gap:14px}
.mode{padding:16px;text-align:left;display:flex;flex-direction:column;gap:6px;border:var(--bw) solid var(--bd);border-radius:var(--r);background:var(--surface);box-shadow:var(--shadow);transition:transform .1s,box-shadow .1s}
.mode:hover{transform:translate(-2px,-2px) rotate(-.6deg);box-shadow:var(--sh-h)}
.mode .ic{width:48px;height:48px;border-radius:14px;border:var(--bw) solid var(--bd);display:grid;place-items:center;font-size:1.5em;background:var(--mc)}
.mode h3{font-size:1.2em}
.mode p{font-size:.85em;color:var(--muted)}
.mode .best{font-family:var(--mono);font-size:.72em;color:var(--muted)}

/* game shell */
.shell{display:flex;flex-direction:column;gap:18px}
.gbar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.prog{flex:1;min-width:140px;height:14px;border:var(--bw) solid var(--bd);border-radius:8px;background:var(--surface);overflow:hidden}
.prog i{display:block;height:100%;background:var(--primary);transition:width .25s}
.count{font-family:var(--mono);font-size:.85em;font-variant-numeric:tabular-nums}

/* flashcards */
.fc{perspective:1200px;background:none;border:0;padding:0;width:100%;display:block}
.fc .in{display:block;position:relative;min-height:290px;transition:transform .5s;transform-style:preserve-3d}
.fc.flip .in{transform:rotateY(180deg)}
.fc .face{position:absolute;inset:0;backface-visibility:hidden;border:var(--bw) solid var(--bd);border-radius:22px;box-shadow:var(--shadow);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:24px;text-align:center}
.fc .front{background:var(--surface)}
.fc .back{background:var(--c);color:var(--on);transform:rotateY(180deg)}
.fc .word{font-family:var(--display);font-weight:800;font-size:2.4em;line-height:1.05}
.fc .ipa{font-family:var(--mono);color:var(--muted)}
.fc .tap{font-family:var(--mono);font-size:.72em;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin-top:8px}
.fc .fr{font-family:var(--display);font-weight:800;font-size:1.8em;line-height:1.1}
.fc .ex{font-style:italic;max-width:46ch}
.fc .trap{font-size:.85em;background:var(--surface);color:var(--ink);border:var(--bw2) solid var(--bd);border-radius:10px;padding:.3em .7em;max-width:46ch}
.deckchip{font-family:var(--mono);font-size:.7em;letter-spacing:.06em;text-transform:uppercase;border:var(--bw2) solid var(--bd);border-radius:999px;padding:.1em .6em;background:var(--c);color:var(--on)}
.icon-btn{border:var(--bw) solid var(--bd);background:var(--surface);border-radius:50%;width:2.4em;height:2.4em;display:inline-grid;place-items:center;font-size:1em;box-shadow:var(--sh-btn)}
.icon-btn.on{background:var(--star);color:var(--star-ink)}
@media (prefers-reduced-motion:reduce){.fc .in{transition:none}}

/* question */
.qcard{padding:22px;display:flex;flex-direction:column;gap:16px}
.prompt{font-family:var(--display);font-weight:800;font-size:1.9em;line-height:1.1}
.subp{color:var(--muted)}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,210px),1fr));gap:10px}
.choice{border:var(--bw) solid var(--bd);background:var(--surface);border-radius:14px;padding:.75em .9em;text-align:left;font-weight:700;box-shadow:var(--sh-btn);display:flex;gap:10px;align-items:center}
.choice .k{font-family:var(--mono);font-size:.75em;border:var(--bw2) solid var(--bd);border-radius:6px;width:1.6em;height:1.6em;display:grid;place-items:center;flex:0 0 auto}
.choice:hover:not(:disabled){background:var(--sunk)}
.choice:disabled{cursor:default}
.choice.right{background:var(--ok-t);border-color:var(--ok)}
.choice.wrong{background:var(--no-t);border-color:var(--no)}
.fb{border-radius:14px;padding:.7em 1em;border:var(--bw) solid var(--bd);display:flex;flex-direction:column;gap:4px}
.fb.good{background:var(--ok-t)} .fb.bad{background:var(--no-t)} .fb.almost{background:color-mix(in srgb,var(--star) 30%,var(--surface))}
.fb b{font-family:var(--display);font-size:1.1em}
.typein{display:flex;gap:10px;flex-wrap:wrap}
.typein input{flex:1;min-width:0;border:var(--bw) solid var(--bd);border-radius:12px;padding:.6em .8em;font-size:1.15em;background:var(--surface)}
.hintline{font-style:italic;color:var(--muted)}

/* match */
.mgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
@media (max-width:640px){.mgrid{grid-template-columns:repeat(2,1fr)}}
.tile{min-height:92px;border:var(--bw) solid var(--bd);border-radius:14px;background:var(--surface);box-shadow:var(--sh-btn);font-weight:700;padding:.6em;line-height:1.25;display:grid;place-items:center;text-align:center;transition:transform .12s,opacity .3s}
.tile.en{font-family:var(--display);font-size:1.05em}
.tile.sel{background:var(--primary);color:var(--on);transform:translate(-2px,-2px)}
.tile.bad{background:var(--no-t);border-color:var(--no);animation:shake .3s}
.tile.gone{opacity:0;pointer-events:none;transform:scale(.85)}
@keyframes shake{25%{transform:translateX(-4px)}75%{transform:translateX(4px)}}
@media (prefers-reduced-motion:reduce){.tile.bad{animation:none}}
.timer{font-family:var(--display);font-weight:800;font-size:1.6em;font-variant-numeric:tabular-nums}

/* results */
.result{padding:24px;display:flex;flex-direction:column;gap:14px;align-items:flex-start}
.big{font-family:var(--display);font-weight:800;font-size:3.4em;line-height:1}
.review{display:flex;flex-direction:column;gap:6px;width:100%}
.rv{display:grid;grid-template-columns:1.6em 1fr;gap:8px;padding:.5em .7em;border-radius:10px;border:2px solid var(--line);font-size:.92em}
.rv.ok{background:var(--ok-t);border-color:var(--ok)} .rv.ko{background:var(--no-t);border-color:var(--no)}
.confetti{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:20}
.confetti i{position:absolute;top:-20px;width:10px;height:14px;border-radius:2px;animation:fall 1.6s ease-in forwards}
@keyframes fall{to{transform:translateY(110vh) rotate(540deg)}}
@media (prefers-reduced-motion:reduce){.confetti{display:none}}
.toast{position:fixed;left:50%;bottom:calc(18px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:.55em 1.1em;border-radius:999px;font-weight:700;font-size:.92em;pointer-events:none;opacity:0;transition:opacity .2s;z-index:30}
.toast.show{opacity:1}

/* ===== SKINS ===== */
/* Aurora: frosted glass cards over soft colour blobs */
:root[data-skin="aurora"]{--bg:#f3f0ff;--surface:rgba(255,255,255,.72);--sunk:rgba(120,90,220,.08);--ink:#1d1a3a;--muted:#5d5a80;--line:rgba(120,100,200,.18);
  --primary:#6d4cff;--on:#fff;--bw:1px;--bw2:1px;--bd:rgba(255,255,255,.85);--r:24px;
  --shadow:0 12px 32px rgba(70,40,160,.12);--sh-btn:0 6px 16px rgba(70,40,160,.12);--sh-btn-h:0 10px 22px rgba(70,40,160,.18);--sh-btn-a:0 2px 6px rgba(70,40,160,.12);--sh-h:0 18px 40px rgba(70,40,160,.2);
  --blob1:#c7b6ff;--blob2:#9fe7e0;--blob3:#ffc2d9;--display:"Outfit",system-ui,sans-serif}
@media (prefers-color-scheme: dark){:root[data-skin="aurora"]:not([data-theme="light"]){--bg:#0e0b22;--surface:rgba(30,24,64,.66);--sunk:rgba(160,140,255,.1);--ink:#f0edff;--muted:#a9a3d6;--line:rgba(160,140,255,.2);--primary:#a18bff;--on:#120d2c;--bd:rgba(255,255,255,.12);--blob1:#3b2a8c;--blob2:#0f5b5a;--blob3:#6b1f4a;--shadow:0 12px 32px rgba(0,0,0,.35);--sh-btn:0 6px 16px rgba(0,0,0,.3);--sh-btn-h:0 10px 22px rgba(0,0,0,.4);--sh-btn-a:0 2px 6px rgba(0,0,0,.3);--sh-h:0 18px 40px rgba(0,0,0,.45)}}
:root[data-skin="aurora"][data-theme="dark"]{--bg:#0e0b22;--surface:rgba(30,24,64,.66);--sunk:rgba(160,140,255,.1);--ink:#f0edff;--muted:#a9a3d6;--line:rgba(160,140,255,.2);--primary:#a18bff;--on:#120d2c;--bd:rgba(255,255,255,.12);--blob1:#3b2a8c;--blob2:#0f5b5a;--blob3:#6b1f4a;--shadow:0 12px 32px rgba(0,0,0,.35);--sh-btn:0 6px 16px rgba(0,0,0,.3);--sh-btn-h:0 10px 22px rgba(0,0,0,.4);--sh-btn-a:0 2px 6px rgba(0,0,0,.3);--sh-h:0 18px 40px rgba(0,0,0,.45)}
:root[data-skin="aurora"] body{background:radial-gradient(40vw 40vw at 8% 10%,var(--blob1),transparent 70%),radial-gradient(45vw 45vw at 95% 25%,var(--blob2),transparent 70%),radial-gradient(50vw 50vw at 50% 105%,var(--blob3),transparent 70%),var(--bg);background-attachment:fixed}
:root[data-skin="aurora"] :is(.pop,.deck,.mode,.btn,.choice,.tile,.stat,.toggle,.icon-btn,.typein input,.fc .front){backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
:root[data-skin="aurora"] .btn{border-radius:999px}
:root[data-skin="aurora"] .btn.main{background:linear-gradient(120deg,#6d4cff,#e0559b);border-color:transparent;color:#fff}
:root[data-skin="aurora"] .mode:hover{transform:translateY(-3px)}
:root[data-skin="aurora"] .mode .ic,:root[data-skin="aurora"] .deck .num{border-color:transparent}
:root[data-skin="aurora"] .prog i{background:linear-gradient(90deg,#6d4cff,#e0559b)}
:root[data-skin="aurora"] h1{background:linear-gradient(100deg,#6d4cff,#e0559b 60%,#14a89a);-webkit-background-clip:text;background-clip:text;color:transparent}

/* Neon: dark arcade, glowing gradients (single dark look) */
:root[data-skin="neon"]{--bg:#0a0a18;--surface:#14142a;--sunk:#1b1b36;--ink:#eef0ff;--muted:#9a9cc8;--line:#2a2a4d;--primary:#00e5ff;--on:#07071a;
  --star:#ffe14d;--ok:#3dffa2;--ok-t:#0f3a2a;--no:#ff4d8d;--no-t:#3d1026;--d1:#00e5ff;--d2:#ff4d8d;--d3:#b26bff;--d4:#3dffa2;--d5:#ff9df0;--d6:#ffd24d;--d7:#4dfff0;--d8:#8c9bff;
  --bw:1.5px;--bw2:1.5px;--bd:#2f2f5a;--r:20px;--shadow:0 0 0 1px rgba(0,229,255,.05),0 10px 30px rgba(0,0,0,.45);--sh-btn:0 0 0 rgba(0,0,0,0);--sh-btn-h:0 0 16px rgba(0,229,255,.35);--sh-btn-a:none;--sh-h:0 0 24px rgba(178,107,255,.45);
  --display:"Outfit",system-ui,sans-serif;color-scheme:dark}
:root[data-skin="neon"] body{background:radial-gradient(60vw 40vw at 100% 0%,rgba(178,107,255,.18),transparent 60%),radial-gradient(60vw 40vw at 0% 100%,rgba(0,229,255,.14),transparent 60%),var(--bg);background-attachment:fixed}
:root[data-skin="neon"] h1{background:linear-gradient(90deg,#00e5ff,#b26bff,#ff4d8d);-webkit-background-clip:text;background-clip:text;color:transparent}
:root[data-skin="neon"] .btn.main{background:linear-gradient(90deg,#00e5ff,#b26bff);border-color:transparent;color:#07071a}
:root[data-skin="neon"] .mode:hover,:root[data-skin="neon"] .deck:hover{border-color:var(--mc,var(--c))}
:root[data-skin="neon"] .mode .ic{border-color:transparent;box-shadow:0 0 18px var(--mc)}
:root[data-skin="neon"] .deck[aria-pressed="true"]{border-color:var(--c);box-shadow:0 0 22px color-mix(in srgb,var(--c) 45%,transparent)}
:root[data-skin="neon"] .deck .num,:root[data-skin="neon"] .deckchip{border-color:transparent;color:#07071a}
:root[data-skin="neon"] .fc .back{color:#07071a;box-shadow:0 0 40px color-mix(in srgb,var(--c) 45%,transparent)}
:root[data-skin="neon"] .prog i{background:linear-gradient(90deg,#00e5ff,#b26bff,#ff4d8d)}
:root[data-skin="neon"] .stat.fire{box-shadow:0 0 16px rgba(255,225,77,.5)}

/* light / dark toggle */
.modetog{display:flex;border:var(--bw2) solid var(--bd);border-radius:999px;background:var(--surface);padding:3px;gap:2px;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.modetog button{border:0;background:none;border-radius:999px;padding:.25em .8em;font-weight:700;font-size:.85em;color:var(--muted);display:flex;gap:6px;align-items:center}
.modetog button[aria-pressed="true"]{background:linear-gradient(120deg,var(--primary),#e0559b);color:#fff}
.hublink{font-weight:700;font-size:.85em;color:var(--primary);text-decoration:none;align-self:flex-start}
.hublink:hover{text-decoration:underline}
.devnote{font-size:.85em;color:var(--muted)}
.kbd{font-family:var(--mono);font-size:.75em;color:var(--muted)}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div class="t">
      <a class="hublink" id="hublink" href="index.html">← All vocab labs</a><span class="eyebrow" id="pEyebrow"></span>
      <h1 id="pTitle">Spot Vocab Lab</h1>
      <p style="color:var(--muted);max-width:56ch" id="pIntro"></p>
    </div>
    <div style="display:flex;flex-direction:column;gap:10px;align-items:flex-end"><div class="modetog" id="modetog" role="group" aria-label="Light or dark mode"><button data-mode-pick="light">☀️ Light</button><button data-mode-pick="dark">🌙 Dark</button></div><div class="stats"><span class="stat"><span id="mastered">0</span><small id="mtot"></small></span><span class="stat fire"><span id="streak">0</span><small>streak</small></span></div></div>
  </header>
  <main id="app" class="shell"></main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
/* ================================================================
   PAGE SETTINGS · to make a new vocabulary page, copy this file and change:
   1. the <title> tag at the top of the file
   2. PAGE below (key must be unique: it stores the students' progress)
   3. DECKS: one line per deck, colours are given automatically (8 colours)
   4. W: one line per word
      [deck number from 0, "english", "/ipa/", "français", "Example sentence.", "Optional trap"]
   Then add one line for the new page in PAGES, in index.html.
   ================================================================ */

const shellTop=(title,prog,count)=>`<div class="gbar"><button class="btn" data-home>← Decks</button><h2>${title}</h2><span class="prog"><i style="width:${prog*100}%"></i></span><span class="count">${count}</span></div>`;

/* FLASHCARDS */
function cards(){
  let q=shuffle(pool()).sort((a,b)=>lv(a)-lv(b)),known=0,total=q.length,flipped=false;
  function draw(){
    if(!q.length){confetti();app.innerHTML=shellTop("Flashcards",1,`${total}/${total}`)+`<div class="pop result"><span class="eyebrow">Round complete</span><div class="big">${known}/${total}</div><p>words you already knew on the first try.</p><div class="row"><button class="btn main" id="again">New round</button><button class="btn" data-home>Back to decks</button></div></div>`;$("#again").onclick=cards;return}
    const w=q[0];flipped=false;
    app.innerHTML=shellTop("Flashcards",(total-q.length)/total,`${total-q.length}/${total}`)+`
    <button class="fc" id="fc" style="--c:${dc(w)}" aria-label="Flip the card"><span class="in">
      <span class="face front"><span class="deckchip" style="--c:${dc(w)}">${DECKS[w.d].name}</span><span class="word">${esc(w.en)}</span><span class="ipa">${esc(w.ipa)}</span><span class="tap">Tap or press space to flip</span></span>
      <span class="face back"><span class="fr">${esc(w.fr)}</span><span class="ex">“${esc(w.ex)}”</span>${w.trap?`<span class="trap">⚠ ${esc(w.trap)}</span>`:""}</span></span></button>
    <div class="row" style="justify-content:center">${speakBtn(w)}${starBtn(w)}</div>
    <div class="row" style="justify-content:center"><button class="btn bad" id="learning">✗ Still learning</button><button class="btn good" id="know">✓ I know it</button></div>
    <p class="kbd" style="text-align:center">Keyboard: space = flip · ← still learning · → I know it</p>`;
    $("#fc").onclick=()=>{flipped=!flipped;$("#fc").classList.toggle("flip",flipped)};
    $("#know").onclick=()=>next(true);$("#learning").onclick=()=>next(false);
  }
  function next(ok){const w=q.shift();if(ok){if(!w._seen)known++;S.lv[w.id]=Math.max(lv(w),2);save();stats()}else{w._seen=true;bump(w,false);q.splice(Math.min(3,q.length),0,w)}draw()}
  keyHandler=e=>{if(!$("#fc"))return;if(e.key===" "){e.preventDefault();$("#fc").click()}else if(e.key==="ArrowRight")next(true);else if(e.key==="ArrowLeft")next(false)};
  q=q.map(w=>({...w}));draw();
}
let keyHandler=null;document.addEventListener("keydown",e=>{if(e.target.tagName==="INPUT")return;keyHandler&&keyHandler(e)});

/* LEARN */
function makeChoice(w,dir,p){
  const others=shuffle((p.length>=4?p:W).filter(x=>x.id!==w.id)).slice(0,3);
  const opts=shuffle([w,...others]);
  return{w,dir,opts,a:opts.findIndex(o=>o.id===w.id)};
}
function learn(){
  const p=pool();const qs=shuffle(p).slice(0,Math.min(10,p.length)).map((w,i)=>makeChoice(w,i%2?"fr":"en",p));
  let i=0,score=0;
  function draw(){
    keyHandler=null;
    if(i>=qs.length){if(score===qs.length)confetti();app.innerHTML=shellTop("Learn",1,`${qs.length}/${qs.length}`)+`<div class="pop result"><span class="eyebrow">Round complete</span><div class="big">${score}/${qs.length}</div><p>${score===qs.length?"Flawless!":score>=qs.length*.7?"Great work, keep going.":"Have another go: practice makes perfect."}</p><div class="row"><button class="btn main" id="again">New round</button><button class="btn" data-home>Back to decks</button></div></div>`;$("#again").onclick=learn;return}
    const q=qs[i],w=q.w,toFr=q.dir==="en";
    app.innerHTML=shellTop("Learn",i/qs.length,`${i+1}/${qs.length}`)+`
    <div class="pop qcard"><div class="row"><span class="deckchip" style="--c:${dc(w)}">${toFr?"English → French":"French → English"}</span><span class="sp"></span>${speakBtn(w)}${starBtn(w)}</div>
      <div class="prompt">${esc(toFr?w.en:w.fr)}</div>${toFr?`<div class="subp" style="font-family:var(--mono)">${esc(w.ipa)}</div>`:""}
      <div class="choices">${q.opts.map((o,k)=>`<button class="choice" data-k="${k}"><span class="k">${k+1}</span>${esc(toFr?o.fr:o.en)}</button>`).join("")}</div>
      <div id="fb"></div></div>`;
    const answer=k=>{
      if(app.querySelector(".choice:disabled"))return;
      const ok=k===q.a;if(ok)score++;bump(w,ok);
      app.querySelectorAll(".choice").forEach((b,j)=>{b.disabled=true;if(j===q.a)b.classList.add("right");else if(j===k)b.classList.add("wrong")});
      $("#fb").innerHTML=`<div class="fb ${ok?"good":"bad"}"><b>${ok?["Spot on!","Nailed it!","Brilliant!","Exactly!"][Math.floor(Math.random()*4)]:"Not quite."}</b><span><strong>${esc(w.en)}</strong> = ${esc(w.fr)}</span><span style="font-style:italic">“${esc(w.ex)}”</span>${w.trap?`<span>⚠ ${esc(w.trap)}</span>`:""}</div><div class="row" style="margin-top:10px"><button class="btn main" id="nx">Continue →</button><span class="kbd">or press Enter</span></div>`;
      $("#nx").onclick=()=>{i++;draw()};$("#nx").focus();
      if(ok&&S.streak>0&&S.streak%5===0)toast(`🔥 ${S.streak} in a row!`);
    };
    app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>answer(+b.dataset.k));
    keyHandler=e=>{if(/^[1-4]$/.test(e.key))answer(+e.key-1)};
  }
  draw();
}

/* WRITE */
const norm=t=>t.toLowerCase().replace(/[’']/g,"'").replace(/[^a-z' -]/g,"").replace(/\s+/g," ").trim().replace(/^(to|a|an|the) /,"");
function lev(a,b){const m=a.length,n=b.length,d=[...Array(m+1)].map((_,i)=>[i]);for(let j=1;j<=n;j++)d[0][j]=j;for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)d[i][j]=Math.min(d[i-1][j]+1,d[i][j-1]+1,d[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return d[m][n]}
function grade(input,w){const a=norm(input),b=norm(w.en),b2=norm(w.en.replace(/ (to|of|at)$/,""));if(!a)return"bad";if(a===b||a===b2||a.replace(/-/g," ")===b.replace(/-/g," "))return"good";if(b.length>=5&&lev(a,b)<=1)return"almost";return"bad"}
function blanked(w){const core=w.en.replace(/^(to|a|an) /,"");const re=new RegExp("\\b"+core.split(" ")[0].slice(0,Math.max(3,core.split(" ")[0].length-3))+"\\w*","i");return w.ex.replace(re,"_____")}
function write(){
  const p=pool();const qs=shuffle(p).slice(0,Math.min(10,p.length));let i=0,score=0;
  function draw(){
    keyHandler=null;
    if(i>=qs.length){if(score===qs.length)confetti();app.innerHTML=shellTop("Write",1,`${qs.length}/${qs.length}`)+`<div class="pop result"><span class="eyebrow">Round complete</span><div class="big">${score}/${qs.length}</div><p>${score===qs.length?"Perfect spelling!":"Spelling counts in the exam: try another round."}</p><div class="row"><button class="btn main" id="again">New round</button><button class="btn" data-home>Back to decks</button></div></div>`;$("#again").onclick=write;return}
    const w=qs[i];let hinted=false;
    app.innerHTML=shellTop("Write",i/qs.length,`${i+1}/${qs.length}`)+`
    <div class="pop qcard"><div class="row"><span class="deckchip" style="--c:${dc(w)}">French → English</span><span class="sp"></span>${starBtn(w)}</div>
      <div class="prompt">${esc(w.fr)}</div>
      <p class="hintline" id="hint" hidden>“${esc(blanked(w))}”</p>
      <form class="typein" id="f"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the English word…" aria-label="Your answer"><button class="btn main">Check</button></form>
      <div class="row"><button class="ghost" id="hb">💡 Show the example</button><button class="ghost" id="skip">I don't know</button></div>
      <div id="fb"></div></div>`;
    $("#ans").focus();
    $("#hb").onclick=()=>{hinted=true;$("#hint").hidden=false};
    const done=r=>{
      $("#ans").disabled=true;app.querySelector("#f button").disabled=true;$("#hb").hidden=true;$("#skip").hidden=true;
      const ok=r==="good"||r==="almost";if(ok)score++;bump(w,ok);
      $("#fb").innerHTML=`<div class="fb ${r==="good"?"good":r==="almost"?"almost":"bad"}"><b>${r==="good"?"Correct!":r==="almost"?"Almost! Watch the spelling.":"The answer was:"}</b><span><strong>${esc(w.en)}</strong> ${esc(w.ipa)} ${speakBtn(w)}</span><span style="font-style:italic">“${esc(w.ex)}”</span>${w.trap?`<span>⚠ ${esc(w.trap)}</span>`:""}</div><div class="row" style="margin-top:10px"><button class="btn main" id="nx">Continue →</button></div>`;
      $("#nx").onclick=()=>{i++;draw()};$("#nx").focus();
    };
    $("#f").onsubmit=e=>{e.preventDefault();const v=$("#ans").value;if(!v.trim())return;done(grade(v,w))};
    $("#skip").onclick=()=>done("bad");
  }
  draw();
}

/* MATCH */
let timerId=null;function stopTimer(){if(timerId){clearInterval(timerId);timerId=null}}
function match(){
  keyHandler=null;stopTimer();
  const ws=shuffle(pool()).slice(0,6);
  const tiles=shuffle(ws.flatMap(w=>[{id:w.id,t:w.en,en:true},{id:w.id,t:w.fr,en:false}]));
  let sel=null,found=0,t0=performance.now(),pen=0,busy=false;
  app.innerHTML=shellTop("Match",0,"0/6")+`<div class="row"><p>Match each English word with its meaning. A wrong pair adds 1 second.</p><span class="sp"></span><span class="timer" id="tm">0.0 s</span></div>
  <div class="mgrid">${tiles.map((x,k)=>`<button class="tile ${x.en?"en":""}" data-t="${k}">${esc(x.t)}</button>`).join("")}</div>`;
  const tm=$("#tm");const tick=()=>{tm.textContent=((performance.now()-t0)/1000+pen).toFixed(1)+" s"};timerId=setInterval(tick,100);
  app.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    if(busy)return;const k=+b.dataset.t;if(sel===k){b.classList.remove("sel");sel=null;return}
    if(sel===null){sel=k;b.classList.add("sel");return}
    const A=tiles[sel],B=tiles[k],bA=app.querySelector(`[data-t="${sel}"]`);
    if(A.id===B.id&&A.en!==B.en){bA.classList.add("gone");b.classList.add("gone");found++;sel=null;bump(W[A.id],true);
      app.querySelector(".prog i").style.width=found/6*100+"%";app.querySelector(".count").textContent=found+"/6";
      if(found===6){stopTimer();const t=(performance.now()-t0)/1000+pen;const rec=!S.best.match||t<S.best.match;if(rec){S.best.match=t;save()}confetti();
        setTimeout(()=>{app.innerHTML=shellTop("Match",1,"6/6")+`<div class="pop result"><span class="eyebrow">${rec?"New record!":"All pairs found"}</span><div class="big">${t.toFixed(1)} s</div><p>Your best time: ${S.best.match.toFixed(1)} s</p><div class="row"><button class="btn main" id="again">Play again</button><button class="btn" data-home>Back to decks</button></div></div>`;$("#again").onclick=match},500)}}
    else{busy=true;pen+=1;S.streak=0;stats();b.classList.add("bad");bA.classList.add("bad");setTimeout(()=>{b.classList.remove("bad");bA.classList.remove("bad","sel");sel=null;busy=false},450)}
  });
}

/* TEST */
function test(){
  keyHandler=null;
  const p=pool();const ws=shuffle(p).slice(0,Math.min(10,p.length));
  const qs=ws.map((w,i)=>i<4?{type:"c",...makeChoice(w,"en",p)}:i<7?{type:"c",...makeChoice(w,"fr",p)}:{type:"w",w});
  const order=shuffle(qs);const res=[];let i=0;
  function draw(){
    if(i>=order.length){finish();return}
    const q=order[i],w=q.w;
    let body;
    if(q.type==="c"){const toFr=q.dir==="en";body=`<div class="prompt">${esc(toFr?w.en:w.fr)}</div><div class="choices">${q.opts.map((o,k)=>`<button class="choice" data-k="${k}"><span class="k">${k+1}</span>${esc(toFr?o.fr:o.en)}</button>`).join("")}</div>`}
    else body=`<div class="prompt">${esc(w.fr)}</div><form class="typein" id="f"><input id="ans" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="Type the English word…" aria-label="Your answer"><button class="btn main">Next</button></form>`;
    app.innerHTML=shellTop("Test",i/order.length,`${i+1}/${order.length}`)+`<div class="pop qcard"><span class="eyebrow">No feedback until the end · question ${i+1}</span>${body}</div>`;
    if(q.type==="c"){app.querySelectorAll(".choice").forEach(b=>b.onclick=()=>rec(+b.dataset.k===q.a,q.opts[+b.dataset.k][q.dir==="en"?"fr":"en"]));keyHandler=e=>{if(/^[1-4]$/.test(e.key))rec(+e.key-1===q.a,q.opts[+e.key-1][q.dir==="en"?"fr":"en"])}}
    else{keyHandler=null;$("#ans").focus();$("#f").onsubmit=e=>{e.preventDefault();const v=$("#ans").value;const g=grade(v,w);rec(g!=="bad",v||"—")}}
  }
  function rec(ok,given){const q=order[i];res.push({q,ok,given});bump(q.w,ok);i++;draw()}
  function finish(){
    keyHandler=null;const n=res.filter(r=>r.ok).length,mark=Math.round(n/res.length*20);
    if(S.best.test==null||mark>S.best.test){S.best.test=mark;save()}
    if(mark>=16)confetti();
    app.innerHTML=shellTop("Test",1,`${res.length}/${res.length}`)+`<div class="pop result"><span class="eyebrow">Your mark</span><div class="big">${mark}/20</div><p>${mark>=18?"Outstanding!":mark>=14?"Very good.":mark>=10?"Fair: review the words in red.":"Go back to Flashcards, then try again."} Best mark: ${S.best.test}/20.</p>
      <div class="review">${res.map(r=>{const w=r.q.w,prompt=r.q.type==="c"&&r.q.dir==="en"?w.en:w.fr,answer=r.q.type==="c"&&r.q.dir==="en"?w.fr:w.en;return`<div class="rv ${r.ok?"ok":"ko"}"><span>${r.ok?"✓":"✗"}</span><span><strong>${esc(prompt)}</strong> → ${esc(answer)}${r.ok?"":` <span style="color:var(--muted)">(your answer: ${esc(r.given)})</span>`}</span></div>`}).join("")}</div>
      <div class="row"><button class="btn main" id="again">New test</button><button class="btn" id="starMissed" ${res.every(r=>r.ok)?"disabled":""}>★ Star the words I missed</button><button class="btn" data-home>Back to decks</button></div></div>`;
    $("#again").onclick=test;
    $("#starMissed").onclick=e=>{res.filter(r=>!r.ok).forEach(r=>S.star[r.q.w.id]=true);save();e.target.disabled=true;toast("Missed words starred")};
  }
  draw();
}

/* One skin, two moods: light = "Aurora", dark = "Neon". Follows the device until the student picks. */
let mode=null;try{mode=localStorage.getItem("vocab-lab-mode")}catch(e){}
if(mode!=="light"&&mode!=="dark")mode=(window.matchMedia&&matchMedia("(prefers-color-scheme: dark)").matches)?"dark":"light";
function applyMode(m,store){mode=m;const r=document.documentElement;r.dataset.skin=m==="dark"?"neon":"aurora";r.dataset.theme=m;
  if(store){try{localStorage.setItem("vocab-lab-mode",m)}catch(e){}}
  document.querySelectorAll("[data-mode-pick]").forEach(b=>b.setAttribute("aria-pressed",b.dataset.modePick===m))}
document.addEventListener("click",e=>{const b=e.target.closest("[data-mode-pick]");if(b)applyMode(b.dataset.modePick,true)});
applyMode(mode,false);
stats();home();
</script>
